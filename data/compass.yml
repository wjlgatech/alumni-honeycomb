# The Calling Compass: 8 questions, 2 per dimension, answered in the browser.
# Each answer scores 0 (fear) .. 3 (calling). A dimension sums its two answers (0..6) and maps to a level.
# Nothing is sent anywhere: scoring runs in web/compass.js; companion/compass.py is the same rule in Python,
# and both must agree on every golden case below (tests/test_compass.py, tests/compass.test.mjs).
scale:
  - {score: 0, zh: 完全不是我, en: Not me at all}
  - {score: 1, zh: 有一点像, en: A little}
  - {score: 2, zh: 大部分是, en: Mostly}
  - {score: 3, zh: 就是我, en: That's me}
levels:
  - {id: frozen, min: 0, max: 1, zh: 冻住, en: Frozen, hint_zh: 先别急着规划，先找一个人说真话。, hint_en: "Don't plan yet. First, tell one person the truth."}
  - {id: shaken, min: 2, max: 3, zh: 动摇, en: Shaken, hint_zh: 你已经在找路了，一位同行者能让这一步变短。, hint_en: "You're already looking for a way. A companion makes this step shorter."}
  - {id: standing, min: 4, max: 5, zh: 站稳, en: Standing, hint_zh: 根基在。下一步是把它放大，并带上一个人。, hint_en: "The ground is there. Next: amplify it, and bring one person with you."}
  - {id: amplified, min: 6, max: 6, zh: 放大, en: Amplified, hint_zh: 你可以成为别人的同行者了。, hint_en: "You could be someone else's companion now."}
questions:
  - {id: s1, dim: spirit, zh: 我相信我的价值不取决于 AI 能不能替代我的工作。, en: "I believe my worth does not depend on whether AI can replace my work."}
  - {id: s2, dim: spirit, zh: 我大概知道，我这一生想为哪一群人解决什么问题。, en: "I roughly know which people I want to solve which problem for in my life."}
  - {id: m1, dim: mind, zh: 这个月我用 AI 做出过一个以前做不出来的东西。, en: "This month I used AI to make something I could not have made before."}
  - {id: m2, dim: mind, zh: 我能说出一段别人没有的经历，以及它教会我的一件事。, en: "I can name one experience others don't have, and one thing it taught me."}
  - {id: h1, dim: heart, zh: 想到未来时，我大多数时候睡得着、吃得下。, en: "When I think about the future, I can still sleep and eat most of the time."}
  - {id: h2, dim: heart, zh: 有至少一个人，我可以对他说出我真正的害怕。, en: "There is at least one person I can tell my real fear to."}
  - {id: t1, dim: strategy, zh: 我知道我面前的下一扇门是哪一扇（升学、求职或创业）。, en: "I know which door is next for me (school, a job, or a venture)."}
  - {id: t2, dim: strategy, zh: 我写下了一个这周就能做、做完能被检验的下一步。, en: "I have written one next step I can do this week and check when it's done."}
amplifier:
  # How AI multiplies one person's unique experience. Shown after the compass, with the person's own words.
  - {x: "×10", zh: 同样的事做得更快：AI 是你的工具。, en: "Do the same work faster: AI is your tool."}
  - {x: "×100", zh: 把你的经历做成一个小产品或服务，帮到一百个和你有同样痛点的人。, en: "Turn your experience into a small product or service for a hundred people with your pain."}
  - {x: "×1000", zh: 带一群人一起做：你的信念成为别人的起点。, en: "Build it with others: your conviction becomes their starting point."}
golden:
  # answers in question order (s1 s2 m1 m2 h1 h2 t1 t2) -> expected levels and the dimension to start with
  - answers: [0, 0, 0, 0, 0, 0, 0, 0]
    levels: {spirit: frozen, mind: frozen, heart: frozen, strategy: frozen}
    start: spirit
  - answers: [3, 3, 3, 3, 3, 3, 3, 3]
    levels: {spirit: amplified, mind: amplified, heart: amplified, strategy: amplified}
    start: null
  - answers: [3, 2, 1, 1, 2, 0, 3, 3]
    levels: {spirit: standing, mind: shaken, heart: shaken, strategy: amplified}
    start: mind
  - answers: [2, 1, 3, 3, 0, 1, 2, 2]
    levels: {spirit: shaken, mind: amplified, heart: frozen, strategy: standing}
    start: heart
