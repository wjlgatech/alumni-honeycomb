cells:
  - id: c-chem-ai
    season: 2026-S3
    status: closed
    tags: [ai-study, tutoring]
    builds_on: [example/c-ai-tutor]
    ceo: s-yu
    vision: An AI-assisted chemistry study group for first-years, aligned with the exam calendar
    good: "Good: 8 first-years use it weekly through the mid-term"
    advisors: [a-qian, a-lin2]
    core: [s-he, s-gao]
    apprentices: [s-fang, s-du]
    outcome:
      evidence: "9 first-years used it weekly for 8 weeks, through the mid-term (sign-in sheet)"
      learned: Aligning the weekly sessions with the exam calendar kept attendance; the week-5 drop seen elsewhere did not happen
  - id: c-math-ai
    season: 2026-S3
    status: closed
    tags: [ai-study, k12-outreach]
    builds_on: [example/c-ai-tutor]
    ceo: s-he
    vision: Middle-school students explain one maths idea with an AI-made animation
    good: "Good: 5 students each present one animation to their class"
    advisors: [a-qian, a-sun]
    core: [s-yu, s-gao]
    apprentices: [s-fang, s-du]
    outcome:
      evidence: "4 of 5 students presented (teacher's note); one dropped out after week 2"
      learned: Pair each middle-schooler with one apprentice; the one who dropped out had no pair
  - id: c-history-ai
    season: 2026-S4
    status: forming
    tags: [ai-study, humanities]
    ceo: s-fang
    vision: Use AI to read primary sources in history, with a study group that meets weekly
    good: "Good: 6 students each write one source-based essay they are proud of"
    advisors: [a-qian]
    core: [s-du]
    apprentices: []

checkins:
