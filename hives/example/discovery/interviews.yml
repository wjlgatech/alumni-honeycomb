# rung 0-4: compliment · time · intro · role · reputation (data/discovery.yml ladder)
# seats: what they committed, by role; `who` is a pseudonym so two people naming one person count once
# breaks: ids from data/discovery.yml breaks (a new id = a new break to add)
# felt_heard: did they say or show it (asked a follow-up, booked again)? gave: what we gave them first
